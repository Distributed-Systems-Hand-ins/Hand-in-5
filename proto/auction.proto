syntax = "proto3";

package auction;

option go_package = "auction/proto";

enum Outcome {
  UNSPECIFIED = 0; // so a missing outcome is never mistaken for success
  SUCCESS = 1;
  FAIL = 2;
  EXCEPTION = 3;
}

message BidRequest {
  string bidder = 1;
  int64 amount = 2;
  int64 request_id = 3;
  bool forwarded = 4;
}
message BidReply {
  Outcome outcome = 1;
  string message = 2;
}

message ResultRequest {
  bool forwarded = 1;
}
message ResultReply {
  bool over = 1;
  int32 highest_bid = 2;
  string highest_bidder = 3; // empty if nobody has bid
  bool started = 4;
  int64 = seconds_left = 5;
}

// Node-to-node: the primary sends its whole state after each accepted bid.
message State {
  int64 seq = 1;
  int32 highest_bid = 2;
  string highest_bidder = 3;
  map<string, BidderInfo> bidders = 4;   // bidder id -> that bidder's last bid
  int64 deadline_unix_nano = 5;  // absolute end time of the auction
}
message Ack {}

message BidderInfo {
  int64 last_request_id = 1;
  BidReply last_reply = 2;
}

service Auction {
  rpc Bid(BidRequest) returns (BidReply);
  rpc Result(ResultRequest) returns (ResultReply);
  rpc Replicate(State) returns (Ack);
}

